<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер валют і одиниць</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Конвертер валют і одиниць</h1>
    </header>

    <main>
        <section>
            <h2>Виберіть тип конвертації</h2>
            <form action="#">
                <input type="radio" id="type-currency" name="conversion-type" value="currency" checked>
                <label for="type-currency">Валюта</label>

                <input type="radio" id="type-length" name="conversion-type" value="length">
                <label for="type-length">Довжина</label>

                <input type="radio" id="type-weight" name="conversion-type" value="weight">
                <label for="type-weight">Вага</label>
            </form>
        </section>

        <section>
            <h2>Форма введення значення й одиниць</h2>
            <form action="#">
                <label for="amount-input">Введіть значення:</label>
                <input type="number" id="amount-input" name="amount" placeholder="Наприклад, 100">

                <label for="from-select">З (валюта):</label>
                <select id="from-select" name="from">
                    <option value="usd">Долар (USD)</option>
                    <option value="eur">Євро (EUR)</option>
                    <option value="uah">Гривня (UAH)</option>
                </select>

                <label for="to-select">В (валюта):</label>
                <select id="to-select" name="to">
                    <option value="uah">Гривня (UAH)</option>
                    <option value="usd">Долар (USD)</option>
                    <option value="eur">Євро (EUR)</option>
                </select>

                <button type="button">Конвертувати</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Примітка: використовується орієнтовний курс валют.</p>
    </footer>
    
    <script src="js/app.js"></script>
</body>
</html>
