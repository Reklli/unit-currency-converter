<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер валют і одиниць</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Конвертер валют і одиниць</h1>
    </header>

    <main>
        <section>
            <h2>Виберіть тип конвертації</h2>
            <form action="#">
                <input type="radio" id="type-currency" name="conversion-type" value="currency" checked>
                <label for="type-currency">Валюта</label>

                <input type="radio" id="type-length" name="conversion-type" value="length">
                <label for="type-length">Довжина</label>

                <input type="radio" id="type-weight" name="conversion-type" value="weight">
                <label for="type-weight">Вага</label>
            </form>
        </section>

        <section>
            <h2>Форма введення значення й одиниць</h2>
            <form id="converter-form" action="#">
                <label for="amount-input">Введіть значення:</label>
                <input type="number" id="amount-input" name="amount" placeholder="Наприклад, 100" required min="0.01" step="any">
                <div class="converter-row">
                    <div class="field-wrapper">
                        <label for="from-select">З (валюта):</label>
                        <select id="from-select" name="from">
                            <option value="USD">Долар (USD)</option>
                            <option value="EUR">Євро (EUR)</option>
                            <option value="UAH">Гривня (UAH)</option>
                        </select>
                    </div>

                    <button type="button" class="btn-swap">⇄</button>

                    <div class="field-wrapper">
                        <label for="to-select">В (валюта):</label>
                        <select id="to-select" name="to">
                            <option value="UAH">Гривня (UAH)</option>
                            <option value="USD">Долар (USD)</option>
                            <option value="EUR">Євро (EUR)</option>
                        </select>
                    </div>
                </div>

                <p id="conversion-result">Результат: —</p>
                <button type="submit">Конвертувати</button>
            </form>
        </section>

        <section>
            <h2>Історія конвертацій</h2>
            <ul id="history-list"></ul>
        </section>

        <section>
            <h2>Актуальні курси валют</h2>
            <p id="rates-count">Завантаження курсів...</p>
            <ul id="rates-list">
                <li class="placeholder">USD: 1 (статична заглушка)</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>Примітка: використовується орієнтовний курс валют.</p>
    </footer>
</body>
</html>
